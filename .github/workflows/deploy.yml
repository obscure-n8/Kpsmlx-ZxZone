name: Deploy ZxZone-Master-MLTB to Heroku

on:
  workflow_dispatch:
    inputs:
      HEROKU_APP_NAME:
        description: "Heroku App name"
        required: true
      HEROKU_API_KEY:
        description: "Heroku API key"
        required: true
      HEROKU_EMAIL:
        description: "Heroku email address"
        required: true
      HEROKU_TEAM_NAME:
        description: "Heroku Team Name (Optional)"
        required: false
      HEROKU_STACK:
        description: "Heroku Stack (24 or 26)"
        required: true
        default: "24"
      BOT_TOKEN:
        description: "Telegram bot token"
        required: true
      OWNER_ID:
        description: "Owner's telegram ID"
        required: true
      DATABASE_URL:
        description: "Database URL from MongoDB"
        required: true
      TELEGRAM_API:
        description: "Telegram API ID"
        required: true
      TELEGRAM_HASH:
        description: "Telegram HASH"
        required: true
      UPSTREAM_REPO:
        description: "Upstream Repo Link"
        required: true
        default: "https://github.com/obscure-n8/ZxZone-Master-MLTB"
      UPSTREAM_BRANCH:
        description: "Upstream Branch"
        required: true
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Set Container Stack
        run: |
          heroku stack:set container -a ${{ inputs.HEROKU_APP_NAME }}
        env:
          HEROKU_API_KEY: ${{ inputs.HEROKU_API_KEY }}

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ inputs.HEROKU_API_KEY }}
          heroku_app_name: ${{ inputs.HEROKU_APP_NAME }}
          heroku_email: ${{ inputs.HEROKU_EMAIL }}
          team: ${{ inputs.HEROKU_TEAM_NAME }}
          usedocker: true
          docker_heroku_process_type: web
          stack: "container"
          region: "us"
          dontuseforce: false
        env:
          HD_STACK_VERSION: ${{ inputs.HEROKU_STACK }}
          HD_OWNER_ID: ${{ inputs.OWNER_ID }}
          HD_TELEGRAM_API: ${{ inputs.TELEGRAM_API }}
          HD_TELEGRAM_HASH: ${{ inputs.TELEGRAM_HASH }}
          HD_DATABASE_URL: ${{ inputs.DATABASE_URL }}
          HD_BOT_TOKEN: ${{ inputs.BOT_TOKEN }}
          HD_UPSTREAM_REPO: ${{ inputs.UPSTREAM_REPO }}
          HD_UPSTREAM_BRANCH: ${{ inputs.UPSTREAM_BRANCH }}
