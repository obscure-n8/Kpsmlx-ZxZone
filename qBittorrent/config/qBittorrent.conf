[Application]
MemoryWorkingSetLimit=512   ; বেশি RAM ব্যবহার করতে পারবে

[BitTorrent]
Session\AddExtensionToIncompleteFiles=true
Session\AnnounceToAllTrackers=true
Session\AnonymousModeEnabled=false
Session\AsyncIOThreadsCount=8
Session\ConnectionSpeed=-1
Session\DHTEnabled=true
Session\DiskCacheSize=128
Session\GlobalDLSpeedLimit=0
Session\GlobalUPSpeedLimit=0
Session\HashingThreadsCount=2
Session\IgnoreSlowTorrentsForQueueing=true
Session\IncludeOverheadInLimits=false
Session\LSDEnabled=true
Session\MaxActiveCheckingTorrents=2
Session\MaxActiveDownloads=5
Session\MaxActiveTorrents=10
Session\MaxActiveUploads=3
Session\MaxConnections=500
Session\MaxConnectionsPerTorrent=100
Session\MaxUploads=-1
Session\MaxUploadsPerTorrent=-1
Session\MultiConnectionsPerIp=true
Session\PexEnabled=true
Session\QueueingSystemEnabled=true
Session\SlowTorrentsDownloadRate=5
Session\SlowTorrentsInactivityTimer=600
Session\SlowTorrentsUploadRate=5
Session\StopTrackerTimeout=5
TrackerEnabled=true

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=4

[Preferences]
Advanced\DisableRecursiveDownload=false
Advanced\RecheckOnCompletion=false
General\PreventFromSuspendWhenDownloading=true
General\PreventFromSuspendWhenSeeding=true
Search\SearchEnabled=true

# WebUI Settings
WebUI\Enabled=true
WebUI\Port=8080
WebUI\BanDuration=3600
WebUI\CSRFProtection=true
WebUI\ClickjackingProtection=true
WebUI\HTTPS\Enabled=false
WebUI\HostHeaderValidation=true
WebUI\LocalHostAuth=true
WebUI\MaxAuthenticationFailCount=5
WebUI\SecureCookie=true
WebUI\SessionTimeout=3600
WebUI\UseUPnP=false
